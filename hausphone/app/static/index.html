<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Haus">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <title>Haus</title>
  <link rel="stylesheet" href="/static/style.css?v=14">
</head>
<body>

  <!-- ── Top bar (status-bar safe area + version) ── -->
  <div id="top-bar">
    <span id="app-version">v14</span>
  </div>

  <!-- ── Live camera ── -->
  <div id="camera-wrap">
    <img id="live-image" src="/image" alt="camera">
    <div id="offline-banner">
      <span>Not on home network.</span>
      <span>Connect to home WiFi or <a href="https://tailscale.com" target="_blank">Tailscale</a> to use controls.</span>
    </div>
  </div>

  <!-- ── Controls ── -->
  <div id="controls">

    <!-- Bedroom Fan + Light -->
    <div class="card">
      <div class="card-pair">
        <div class="card-half">
          <div class="card-header">
            <span class="status-dot" id="fan-dot"></span>
            <span class="card-label">M.Fan</span>
            <button class="toggle-btn" id="fan-toggle">OFF</button>
            <button class="expand-btn" id="fan-expand" aria-label="Adjust speed">&#8964;</button>
          </div>
        </div>
        <div class="card-pair-divider"></div>
        <div class="card-half">
          <div class="card-header">
            <span class="status-dot" id="fanlight-dot"></span>
            <span class="card-label">M.Light</span>
            <button class="toggle-btn" id="fanlight-toggle">OFF</button>
            <button class="expand-btn" id="fanlight-expand" aria-label="Adjust brightness">&#8964;</button>
          </div>
        </div>
      </div>
      <div class="card-detail" id="fan-detail">
        <div class="slider-row">
          <label>Speed</label>
          <input type="range" id="fan-speed" min="0" max="100" value="0">
          <span class="slider-val" id="fan-speed-val">0%</span>
        </div>
      </div>
      <div class="card-detail" id="fanlight-detail">
        <div class="slider-row">
          <label>Dim</label>
          <input type="range" id="fan-bright" min="0" max="100" value="0">
          <span class="slider-val" id="fan-bright-val">0%</span>
        </div>
      </div>
    </div>

    <!-- Lght E + Lght W -->
    <div class="card">
      <div class="card-pair">
        <div class="card-half">
          <div class="card-header">
            <span class="status-dot" id="vera-east-dot"></span>
            <span class="card-label">Lght E</span>
            <button class="toggle-btn" id="vera-east-toggle">OFF</button>
          </div>
        </div>
        <div class="card-pair-divider"></div>
        <div class="card-half">
          <div class="card-header">
            <span class="status-dot" id="vera-west-dot"></span>
            <span class="card-label">Lght W</span>
            <button class="toggle-btn" id="vera-west-toggle">OFF</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Attic1 + Attic2 -->
    <div class="card">
      <div class="card-pair">
        <div class="card-half">
          <div class="card-header">
            <span class="status-dot" id="vera-attic1-dot"></span>
            <span class="card-label">Attic1</span>
            <button class="toggle-btn" id="vera-attic1-toggle">OFF</button>
          </div>
        </div>
        <div class="card-pair-divider"></div>
        <div class="card-half">
          <div class="card-header">
            <span class="status-dot" id="vera-attic2-dot"></span>
            <span class="card-label">Attic2</span>
            <button class="toggle-btn" id="vera-attic2-toggle">OFF</button>
          </div>
        </div>
      </div>
    </div>

    <!-- LD Floor -->
    <div class="card">
      <div class="card-header">
        <span class="status-dot" id="vera-ld-floor-dot"></span>
        <span class="card-label">LD Floor</span>
        <button class="toggle-btn" id="vera-ld-floor-toggle">OFF</button>
      </div>
    </div>

    <!-- Water Feature -->
    <div class="card">
      <div class="card-header">
        <span class="status-dot" id="wemo-water-dot"></span>
        <span class="card-label">Water Feature</span>
        <span class="timer-badge" id="wemo-water-feature-timer"></span>
        <button class="toggle-btn" id="wemo-water-toggle">OFF</button>
      </div>
    </div>

    <!-- Garage Door (slide to activate) -->
    <div class="card">
      <div class="card-header">
        <span class="status-dot" id="vera-garage-dot"></span>
        <span class="card-label">Garage</span>
        <span class="state-badge" id="vera-garage-state">CLOSED</span>
      </div>
      <div class="slide-activate">
        <input type="range" id="garage-slide" min="0" max="100" value="0" aria-label="Slide to activate garage">
      </div>
    </div>

  </div><!-- /controls -->

  <!-- ── Cert install bar ── -->
  <div id="cert-bar">
    <span>Install certificate to trust this site &amp; enable PWA install.</span>
    <a href="/cert.crt">Install Cert</a>
    <button id="cert-dismiss">&#x2715;</button>
  </div>

  <!-- ── Install bar ── -->
  <div id="install-bar">
    <span id="install-text">Install Haus on your home screen for quick access.</span>
    <button id="install-btn">Install</button>
  </div>

  <script src="/static/app.js?v=14"></script>
</body>
</html>
