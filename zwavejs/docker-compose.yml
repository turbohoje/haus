services:
  zwave-js-ui:
    image: zwavejs/zwave-js-ui:latest
    container_name: zwave-js-ui
    restart: unless-stopped
    tty: true
    stop_signal: SIGINT
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - TZ=America/Denver
      # Security keys are configured in the UI (Settings -> Z-Wave -> Security Keys).
      # Keep the generated values in .env so they survive a store wipe / re-paste.
    devices:
      # Zooz 800 Z-Wave stick. Host side uses the stable /dev/serial/by-id path (the
      # ACM number can change across reboots); it's presented INSIDE the container as
      # /dev/ttyACM0, which is the port set in the zwave-js-ui UI (Settings -> Z-Wave).
      # Verify the host path with: ls -l /dev/serial/by-id/
      - '/dev/serial/by-id/usb-Zooz_800_Z-Wave_Stick_533D004242-if00:/dev/ttyACM0'
    volumes:
      - zwave-js-ui-store:/usr/src/app/store
    ports:
      # Web UI / control panel — network management, inclusion, healing, naming.
      - '8091:8091'
      # zwave-js-server WebSocket. The UI is configured with serverPort=3001, so we
      # publish container 3001 -> host 3001. hausphone connects to ws://127.0.0.1:3001.
      # (Host 3000 is off-limits — the hausphone container owns it via network_mode: host.)
      - '3001:3001'

volumes:
  # Named volume holds the Z-Wave network state + security keys. Do NOT bind-mount
  # this into the repo dir — it contains secrets. Back it up with:
  #   docker run --rm -v zwavejs_zwave-js-ui-store:/store -v $PWD:/backup alpine \
  #     tar czf /backup/zwave-store-backup.tgz -C /store .
  zwave-js-ui-store:
